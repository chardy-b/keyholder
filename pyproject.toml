[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-keyholder"
version = "0.2.0"
description = "Local Unix-socket token broker for Hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "pyjwt[crypto]>=2.8",
  "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
keyholder = "keyholderd.cli:main"
keyholderd = "keyholderd.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyholderd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
